const decode = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const status = document.getElementById('status');
  const button = document.getElementById('submit');
  const password = document.getElementById('pwd').value;
  if (!crypto.subtle) { status.textContent = '请通过 HTTPS 安全链接访问此页面。'; return; }
  button.disabled = true; status.textContent = '正在解密…';
  try {
    const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode(payload.salt),iterations:310000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
    const plain = await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(payload.iv)},key,decode(payload.ciphertext));
    document.open(); document.write(new TextDecoder().decode(plain)); document.close();
  } catch (_) {
    status.textContent = '密码错误或内容解密失败。'; button.disabled = false;
  }
